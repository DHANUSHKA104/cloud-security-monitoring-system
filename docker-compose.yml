version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cloudsec-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudsec-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      SIM_API_KEY: ${SIM_API_KEY}
      SIM_ADMIN_EMAIL: ${SIM_ADMIN_EMAIL}
      SIM_ADMIN_PASSWORD: ${SIM_ADMIN_PASSWORD}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD}
      ANALYTICS_URL: http://analytics:8000
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "127.0.0.1:8080:8080"

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: cloudsec-analytics
    restart: on-failure
    depends_on:
      - backend
    environment:
      ANALYTICS_DB_URL: postgresql://analytics_ro:${ANALYTICS_DB_PASSWORD}@postgres:5432/${DB_NAME}
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
