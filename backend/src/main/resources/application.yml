server:
  port: 8080
  address: 127.0.0.1
  servlet:
    context-path: /

spring:
  application:
    name: cloudsec-monitor-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/cloudsec}
    username: ${DB_USER:cloudsec}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      analyticsDbPassword: ${ANALYTICS_DB_PASSWORD}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_DAYS:7}
  sim:
    api-key: ${SIM_API_KEY}
    admin-email: ${SIM_ADMIN_EMAIL:admin@cloudsec.local}
    admin-password: ${SIM_ADMIN_PASSWORD}
  seed:
    dev-password: ${DEV_SEED_PASSWORD}
  analytics:
    url: ${ANALYTICS_URL:http://127.0.0.1:8000}
    api-key: ${ANALYTICS_API_KEY}
    timeout-ms: 2000
    cache-ttl-seconds: 60
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
